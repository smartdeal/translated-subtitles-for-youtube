<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Translated Subtitles for YouTube</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Translated subtitles</h1>
    <form id="form">
      <label>From
        <select name="sourceLanguage"></select>
      </label>
      <label>To
        <select name="targetLanguage"></select>
      </label>
      <fieldset>
        <legend>Show</legend>
        <label class="row"><input type="radio" name="display" value="dual" /> Original + translation</label>
        <label class="row"><input type="radio" name="display" value="translation" /> Translation only</label>
      </fieldset>
      <label>Font size <output id="scaleOut"></output>
        <input type="range" name="fontScale" min="0.6" max="2" step="0.1" />
      </label>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
